name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * 1,3,6'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Check
        run: |
          curl -i "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
